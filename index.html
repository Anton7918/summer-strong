<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07090D">
<title>Summer Strong · Amersham &amp; Chiltern U13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  :root {
    --burgundy:#8D2145; --burgundy-dk:#5A1530; --burgundy-lt:#B23461;
    --gold:#F2A900; --gold-dk:#C68A00;
    --black:#07090D; --bg-2:#13161B; --bg-3:#1E2229; --bg-4:#2A2F38;
    --text:#F4F1EA; --muted:#9aa0a6; --line:#2C3038;
    --green:#3FAE5F; --red:#D44A3F;
  }
  *,*::before,*::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--black); color: var(--text);
    font-family: 'Barlow', system-ui, sans-serif; min-height: 100vh;
    overscroll-behavior: contain; -webkit-font-smoothing: antialiased;
  }
  body {
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, rgba(141,33,69,0.35) 0%, transparent 60%),
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(242,169,0,0.06) 0%, transparent 60%),
      var(--black);
    background-attachment: fixed;
  }
  #root { max-width: 430px; margin: 0 auto; min-height: 100vh; position: relative; padding: 16px 16px 60px; }
  h1, h2, h3, h4 { font-family: 'Rajdhani', sans-serif; font-weight: 700; margin: 0; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.05; }
  h1 { font-size: 28px; }
  h2 { font-size: 22px; }
  h3 { font-size: 18px; }
  h4 { font-size: 15px; color: var(--gold); }
  p { margin: 0 0 8px; line-height: 1.45; }
  a { color: var(--gold); }

  .stat-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; line-height: 1; }
  .label { font-family: 'Rajdhani', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; color: var(--muted); }

  .card { background: linear-gradient(180deg, var(--bg-2), var(--bg-3)); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .card-burgundy { background: linear-gradient(180deg, var(--burgundy), var(--burgundy-dk)); border: 1px solid var(--gold); border-radius: 14px; padding: 14px; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; cursor:pointer; padding:14px 18px; font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; border-radius:10px; transition:transform .08s ease, filter .12s ease; user-select:none; width:100%; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--gold); color: var(--black); box-shadow: 0 4px 0 var(--gold-dk); }
  .btn-primary:active { box-shadow: 0 2px 0 var(--gold-dk); transform: translateY(2px); }
  .btn-secondary { background: var(--burgundy); color: var(--text); border: 1px solid var(--gold); }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn-sm { padding: 8px 12px; font-size: 13px; width: auto; }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }

  .row { display: flex; gap: 10px; align-items: center; }
  .row-between { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }

  .pip { display:inline-block; width:14px; height:14px; border-radius:50%; border:2px solid var(--gold); background: transparent; }
  .pip.on { background: var(--gold); }

  .chip { display: inline-flex; align-items:center; gap:6px; padding:4px 10px; border:1px solid var(--gold); border-radius:999px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12px; text-transform: uppercase; letter-spacing:0.1em; color: var(--gold); background: rgba(242,169,0,0.08); }
  .chip-burgundy { border-color: var(--burgundy-lt); color: var(--burgundy-lt); background: rgba(141,33,69,0.18); }

  .header-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
  .back-btn { background: transparent; border:none; color: var(--gold); font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:0.1em; cursor:pointer; padding: 6px 0; }

  /* Setup */
  .level-card { background: var(--bg-2); border: 2px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; transition: border-color .15s, transform .08s; }
  .level-card.foundation { border-left: 6px solid #3FAE5F; }
  .level-card.advanced { border-left: 6px solid #C68A00; }
  .level-card.pro { border-left: 6px solid var(--burgundy); }
  .level-card.selected { border-color: var(--gold); background: linear-gradient(180deg, rgba(242,169,0,0.12), rgba(242,169,0,0.02)); }
  .level-card:active { transform: scale(0.99); }

  .club-tile { padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--bg-2); text-align:center; cursor:pointer; user-select:none; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; }
  .club-tile.selected { border-color: var(--gold); background: rgba(242,169,0,0.10); color: var(--gold); }

  .input { width: 100%; background: var(--bg-3); border: 1px solid var(--line); color: var(--text); padding: 12px 14px; border-radius: 10px; font-family: 'Barlow', sans-serif; font-size: 16px; }
  .input:focus { outline: 2px solid var(--gold); border-color: var(--gold); }

  /* Calendar */
  .cal-grid { display: grid; grid-template-columns: 28px repeat(7, 1fr) 44px; gap: 2px; }
  .cal-cell { background: var(--bg-2); border-radius: 6px; padding: 4px 2px; min-height: 42px; font-size: 11px; text-align: center; position: relative; font-family:'Barlow Condensed', sans-serif; font-weight:600; }
  .cal-head { background: var(--burgundy-dk); color: var(--gold); padding: 5px 0; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border-radius: 4px; font-family:'Rajdhani',sans-serif; }
  .cal-week { background: var(--burgundy); color: var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700; border-radius:4px; }
  .cal-tally { background: var(--bg-3); display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:13px; color: var(--gold); border-radius:4px; }
  .cal-cell.thu { background: rgba(141,33,69,0.18); border: 1px solid rgba(242,169,0,0.25); }
  .cal-cell.bh { background: rgba(242,169,0,0.10); }
  .cal-cell.today { outline: 2px solid var(--gold); background: rgba(242,169,0,0.18); }
  .cal-cell.done { background: rgba(63,174,95,0.18); }
  .cal-day { font-size: 12px; font-weight: 700; color: var(--text); }
  .cal-bh { font-size: 8px; color: var(--gold); display: block; }
  .cal-tick { color: var(--green); font-size: 14px; line-height: 1; }
  .cal-ball { display: block; margin: 1px auto 0; }

  /* Set logger */
  .big-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 96px; line-height: 1; color: var(--gold); text-shadow: 0 4px 20px rgba(242,169,0,0.3); }
  .big-num small { color: var(--muted); font-size: 28px; }
  .num-input { width: 100%; background: var(--bg-3); border: 2px solid var(--gold); color: var(--gold); padding: 16px; border-radius: 12px; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800; text-align: center; }
  .num-input:focus { outline: none; background: rgba(242,169,0,0.10); }
  .stepper-btn { width: 64px; height: 64px; border-radius: 12px; background: var(--burgundy); color: var(--text); border: 1px solid var(--gold); font-size: 28px; font-family: 'Rajdhani', sans-serif; font-weight: 700; cursor: pointer; }
  .stepper-btn:active { transform: scale(0.95); }
  .quick-btn { padding: 10px 14px; border-radius: 8px; background: var(--bg-3); color: var(--gold); border: 1px solid var(--line); font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; cursor: pointer; flex:1; }

  .timer-circle { width: 200px; height: 200px; border-radius: 50%; background: var(--bg-3); border: 6px solid var(--burgundy); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 16px auto; box-shadow: inset 0 0 0 4px rgba(0,0,0,0.4); }
  .timer-circle.run { border-color: var(--gold); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: inset 0 0 0 4px rgba(0,0,0,0.4), 0 0 0 0 rgba(242,169,0,0.4); } 50% { box-shadow: inset 0 0 0 4px rgba(0,0,0,0.4), 0 0 0 12px rgba(242,169,0,0); } }
  .timer-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 72px; color: var(--gold); line-height: 1; }

  .side-banner { display: flex; align-items:center; justify-content: center; padding: 14px; border-radius: 10px; background: linear-gradient(90deg, var(--burgundy), var(--burgundy-dk)); border: 1px solid var(--gold); margin: 8px 0 14px; font-family:'Rajdhani',sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--gold); color: var(--black); padding: 14px 20px; border-radius: 12px; font-family: 'Rajdhani', sans-serif; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; max-width: 380px; }
  .toast strong { display: block; font-size: 16px; }
  .toast small { font-family: 'Barlow', sans-serif; font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 13px; }

  /* Confetti */
  .confetti-piece { position: fixed; top: -10px; width: 8px; height: 14px; pointer-events: none; z-index: 90; animation: fall linear forwards; }
  @keyframes fall {
    0% { transform: translate(0, -10px) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), 105vh) rotate(720deg); opacity: 0; }
  }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: linear-gradient(180deg, var(--burgundy), var(--burgundy-dk)); border: 2px solid var(--gold); border-radius: 16px; padding: 22px; max-width: 400px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }

  .progress-bar { height: 8px; background: var(--bg-3); border-radius: 999px; overflow: hidden; }
  .progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--gold), #FFCB42); transition: width 0.4s; }

  .ach-row { display:flex; align-items:center; gap:10px; padding: 10px; border-radius: 8px; }
  .ach-row.earned { background: rgba(242,169,0,0.10); border: 1px solid rgba(242,169,0,0.4); }
  .ach-row.locked { background: rgba(255,255,255,0.03); border: 1px solid var(--line); opacity: 0.6; }

  .session-row { padding: 10px 12px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); display:flex; align-items:center; justify-content: space-between; }
  .session-row + .session-row { margin-top: 6px; }

  .technique li { margin-bottom: 6px; line-height: 1.45; }
  .cue { font-style: italic; color: var(--gold); }

  .ex-card { display:flex; gap:12px; align-items:center; padding: 14px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
  .ex-card.done { border-color: var(--green); background: rgba(63,174,95,0.10); }
  .ex-card:active { transform: scale(0.99); }
  .ex-icon { width: 48px; height: 48px; border-radius: 10px; background: var(--burgundy); border: 1px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:'Rajdhani',sans-serif; font-weight:700; color: var(--gold); font-size: 11px; letter-spacing: 0.08em; flex-shrink: 0; }

  .level-pill { display:inline-flex; align-items:center; padding: 4px 10px; border-radius: 999px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:11px; letter-spacing: 0.1em; text-transform: uppercase; }
  .level-pill.foundation { background: #1F3D2A; color: #6BCB7E; border: 1px solid #3FAE5F; }
  .level-pill.advanced { background: #3D2F0E; color: #E0B23B; border: 1px solid #C68A00; }
  .level-pill.pro { background: #3D1626; color: #E76A8F; border: 1px solid var(--burgundy-lt); }

  .nav-tabs { display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; padding: 4px; background: var(--bg-2); border-radius: 12px; border: 1px solid var(--line); margin-top: 14px; }
  .nav-tab { padding: 10px 4px; background: transparent; color: var(--muted); border: none; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; cursor: pointer; border-radius: 8px; }
  .nav-tab.active { background: var(--burgundy); color: var(--gold); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 4px; }

  .help { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .stripe { height: 4px; background: linear-gradient(90deg, var(--burgundy), var(--gold)); border-radius: 2px; margin: 0 0 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// =================== DATA ===================
const CLUBS = [
  { id:'acrfc', name:'Amersham & Chiltern RFC', short:'A&C',   cheers:["Up the burgundy!","For the swan and the axe!","A&C strong!","That's a Chiltern shift!"] },
  { id:'eng',   name:'England Rugby',           short:'ENG',   cheers:["Sweet Chariot strength!","Power in white!","Carry them home!"] },
  { id:'sco',   name:'Scotland Rugby',          short:'SCO',   cheers:["Flower of Scotland power!","Thistle and thunder!","Roar like Murrayfield!"] },
  { id:'wal',   name:'Wales Rugby',             short:'WAL',   cheers:["Cymru am byth!","Red dragon roar!","Hwyl, Cymru!"] },
  { id:'ire',   name:'Ireland Rugby',           short:'IRE',   cheers:["Up the boys in green!","Ireland's Call answered!","Shoulder to shoulder!"] },
  { id:'fra',   name:'France Rugby',            short:'FRA',   cheers:["Allez les Bleus!","French flair!","Le coq chante!"] },
  { id:'ita',   name:'Italy Rugby',             short:'ITA',   cheers:["Forza Azzurri!","Italian fire!","Avanti azzurri!"] },
  { id:'nzl',   name:'All Blacks',              short:'NZL',   cheers:["Haka power!","Silver fern strong!","Kia kaha, kia toa!"] },
  { id:'rsa',   name:'Springboks',              short:'RSA',   cheers:["Bokke power!","Green and gold!","Sterk soos 'n Bok!"] },
  { id:'aus',   name:'Wallabies',               short:'AUS',   cheers:["Go you Wallabies!","Gold standard!","Wallabies on the charge!"] },
  { id:'arg',   name:'Pumas',                   short:'ARG',   cheers:["Vamos Pumas!","Sangre y orgullo!","Roar of the Pampas!"] },
  { id:'other', name:'Other',                   short:'OTH',   cheers:["Brilliant work!","Pure graft!","That's the standard!","Top set!"] }
];
function clubFor(id){ return CLUBS.find(c=>c.id===id) || CLUBS[CLUBS.length-1]; }

const EXERCISES = {
  foundation: [
    {
      id:'pushup_f', name:'Push-Up', pattern:'PUSH',
      sets:3, type:'reps', target:12, targetLabel:'10–12 reps', restSeconds:60,
      cues:['2s down','chest to floor','body rigid'],
      steps:[
        'High plank: hands slightly wider than shoulders. Body forms a straight line from head to heels.',
        'Lower your chest slowly to the floor — take 2 full seconds on the way down.',
        'Stop just before your chest touches the ground. Push back up powerfully.',
        'Keep elbows at roughly 45° from your torso — not flared straight out to the sides.',
        'Squeeze glutes and brace abs throughout. Keep hips level — avoid letting them sag or rise.'
      ],
      coachingCues:[
        '"Armpits over little fingers" — this hand position protects your shoulders.',
        'The 2-second lowering phase (eccentric) builds more strength than the push.',
        'If your hips sag, drop to knee push-ups until you build the strength.'
      ]
    },
    {
      id:'squat_f', name:'Bodyweight Squat', pattern:'SQUAT',
      sets:3, type:'reps', target:15, targetLabel:'12–15 reps', restSeconds:60,
      cues:['Chest tall','2s pause at bottom','heels down'],
      steps:[
        'Feet shoulder-width apart, toes slightly turned out.',
        'Sit back and down, keeping your chest tall and back straight.',
        'Lower until your thighs are parallel to the floor (or as low as you comfortably can).',
        'Pause 2 seconds at the bottom. Drive through your heels to stand.'
      ],
      coachingCues:[
        '"Knees track over second toe" throughout — never let them cave inward.'
      ]
    },
    {
      id:'glute_f', name:'Glute Bridge', pattern:'HINGE',
      sets:3, type:'reps', target:15, targetLabel:'15 reps', restSeconds:45,
      cues:['Drive hips up','squeeze glutes hard','1s hold'],
      steps:[
        'Lie on your back, feet flat, knees bent to roughly 90°.',
        'Drive both feet into the floor and press your hips up toward the ceiling.',
        'Squeeze your glutes hard at the top. Hold 1 second. Lower slowly over 2 seconds.',
        'Keep movement in the glutes — do not arch your lower back.'
      ],
      coachingCues:[
        '"Push the floor away" rather than "lift my hips" — gives better glute activation.'
      ]
    },
    {
      id:'sideplank_f', name:'Side Plank', pattern:'CORE SIDES',
      sets:3, type:'time_each_side', target:20, targetLabel:'20s each side', restSeconds:45,
      cues:['Straight line head to feet','hips up','breathe'],
      steps:[
        'Lie on your side, forearm on the floor with elbow directly under your shoulder.',
        'Stack your feet. Lift your hips off the floor until you form a straight line from head to feet.',
        'Hold still. Breathe. Try not to let your hips sag — cue: "pull your bottom hip upward".',
        'Easier version: bend the bottom knee to the floor.'
      ],
      coachingCues:[
        '"Pull your bottom hip upward" is the key cue that prevents sagging.'
      ]
    }
  ],
  advanced: [
    {
      id:'pushup_a', name:'Decline Push-Up', pattern:'PUSH',
      sets:4, type:'reps', target:10, targetLabel:'8–10 reps', restSeconds:60,
      cues:['Feet on chair','steep angle','2s down'],
      steps:[
        'Place both feet on a chair. Hands stay on the floor.',
        'Do the push-up as normal — the angle shifts more work to your upper chest and shoulders.',
        'Lower slowly over 2 seconds. Chest just above the floor. Push up powerfully.',
        'Keep elbows at roughly 45° from your torso. Body rigid head to heels.'
      ],
      coachingCues:[
        '"Armpits over little fingers" — this hand position protects your shoulders.',
        'The 2-second lowering phase (eccentric) builds more strength than the push.'
      ]
    },
    {
      id:'pullup_a', name:'Pull-Up / Negative', pattern:'PULL',
      sets:4, type:'reps', target:8, targetLabel:'6–8 reps', restSeconds:90,
      cues:['Chin over bar','4s slow lower','full hang'],
      steps:[
        'Hang from a bar with a full dead-hang, shoulders "packed" (not shrugging).',
        'Pull until your chin clears the bar — lead with the chest, not the chin.',
        'NEGATIVE: jump or step to the chin-over-bar position. Lower yourself over 4–5 full seconds. Push back up to reset.'
      ],
      coachingCues:[
        '"Pull elbows to your hips" — not hands to your shoulders.',
        'The slow lowering builds as much strength as the pull itself.',
        'A doorframe pull-up bar costs around £15–20 and is worth it.'
      ]
    },
    {
      id:'squat_a', name:'Jump Squat', pattern:'SQUAT',
      sets:4, type:'reps', target:10, targetLabel:'8–10 reps', restSeconds:75,
      cues:['Squat to parallel','explode up','land soft'],
      steps:[
        'Squat to parallel as in the bodyweight squat. Explode upward as powerfully as possible.',
        'Land softly on the balls of your feet, absorbing through ankles, knees and hips.',
        'Stick the landing for 1 second before the next rep.'
      ],
      coachingCues:[
        '"Knees track over second toe" throughout — never let them cave inward.',
        'For jump squats: the landing is the skill. Quiet, controlled landings protect your knees.'
      ]
    },
    {
      id:'glute_a', name:'Single-Leg Glute Bridge', pattern:'HINGE',
      sets:4, type:'reps_each_side', target:12, targetLabel:'10–12 each leg', restSeconds:60,
      cues:['One foot flat','hips level','squeeze at top'],
      steps:[
        'Lie on your back. Same setup as a glute bridge but extend one leg straight.',
        'Push up on the planted foot. Drive your hips up toward the ceiling.',
        'Keep your hips level — the lifted-leg side should not drop.',
        'Squeeze your glutes at the top. Lower slowly. Complete all reps, then switch.'
      ],
      coachingCues:[
        '"Push the floor away" rather than "lift my hips" — gives better glute activation.'
      ]
    },
    {
      id:'hollow_a', name:'Hollow Body Hold', pattern:'CORE FRONT',
      sets:4, type:'time', target:30, targetLabel:'25–30s hold', restSeconds:45,
      cues:['Low back flat','legs at 45°','arms by ears'],
      steps:[
        'Lie flat. Press lower back firmly into the floor and hold it there.',
        'Raise legs to roughly 45° and raise shoulders slightly off the floor.',
        'Arms extend alongside body or past ears. Hold. Breathe. Lower back stays flat.',
        'If your lower back lifts: raise your legs higher until it does not.'
      ],
      coachingCues:[
        '"Glue your lower back to the floor" — the single most important cue.',
        'These look easy. They are not. Slow and deliberate beats fast and sloppy.'
      ]
    },
    {
      id:'sideplank_a', name:'Side Plank Hip Dip', pattern:'CORE SIDES',
      sets:4, type:'reps_each_side', target:10, targetLabel:'10 dips each', restSeconds:45,
      cues:['Lower hip to floor','drive back up','controlled'],
      steps:[
        'Hold the side plank position. Lower your hips until they just touch the floor.',
        'Drive back up to the straight-line position. That is one rep. Stay controlled.',
        'Forearm on the floor, elbow directly under your shoulder throughout.'
      ],
      coachingCues:[
        '"Pull your bottom hip upward" between dips to keep the line straight.'
      ]
    }
  ],
  pro: [
    {

const STORAGE_KEY = 'ss_v1_jamie';
const PROGRAMME_START = new Date(2026, 4, 4); // May 4 2026 (month is 0-indexed)
const PROGRAMME_WEEKS = 18;

// =================== HELPERS ===================
function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(d,n){ const c=new Date(d); c.setDate(c.getDate()+n); return c; }
function isThursday(d){ return d.getDay()===4; }
function startOfISOWeek(d){ const c=new Date(d); const day=(c.getDay()||7)-1; c.setDate(c.getDate()-day); c.setHours(0,0,0,0); return c; }

function defaultState(){
  return {
    profile: null,
    stats: { xp:0, totalSets:0, totalSessions:0 },
    achievements: [],
    perExerciseSets: {}, // exerciseId -> count
    sessionsByLevel: { foundation:0, advanced:0, pro:0 },
    qualifiedFor: { advanced:false, pro:false },
    sessions: [],
    currentSession: null
  };
}

function computeQualifications(perEx){
  return {
    advanced: EXERCISES.foundation.every(ex => (perEx[ex.id]||0) >= 6),
    pro:      EXERCISES.advanced.every(ex => (perEx[ex.id]||0) >= 6)
  };
}

const LEVEL_RANK = { foundation:0, advanced:1, pro:2 };

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    return { ...defaultState(), ...JSON.parse(raw) };
  } catch(e){ return defaultState(); }
}
function saveState(s){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e){}
}

function computeStreak(sessions){
  if (!sessions.length) return 0;
  const days = new Set(sessions.filter(s=>s.completed).map(s=>s.date));
  let streak = 0;
  let d = new Date(); d.setHours(0,0,0,0);
  if (!days.has(dateKey(d))) d = addDays(d,-1);
  while (days.has(dateKey(d))) { streak++; d = addDays(d,-1); }
  return streak;
}

function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function programmeWeekFor(d){
  const ms = (d - PROGRAMME_START) / (1000*60*60*24);
  if (ms < 0) return 0;
  return Math.floor(ms/7) + 1;
}

function useToast(){
  const [toast, setToast] = useState(null);
  const tRef = useRef();
  function show(payload, ms=3500){
    setToast(payload);
    clearTimeout(tRef.current);
    tRef.current = setTimeout(()=>setToast(null), ms);
  }
  return [toast, show];
}

// =================== EXERCISE / SET LOGGER ===================
function ExerciseScreen({ state, dispatch, navigate, exerciseId }){
  const session = state.currentSession;
  const ex = EXERCISES[session.level].find(e=>e.id===exerciseId);
  const exData = session.exercises[exerciseId];
  const completedSets = exData.sets.filter(s=>s.complete).length;
  const totalSets = ex.sets;

  // Find next incomplete set index
  const nextIdx = exData.sets.findIndex(s=>!s.complete);
  const allDone = nextIdx === -1;

  // ----- Live state for the working set -----
  const isReps = ex.type === 'reps' || ex.type === 'reps_each_side';
  const isTime = ex.type === 'time' || ex.type === 'time_each_side';
  const isEachSide = ex.type === 'reps_each_side' || ex.type === 'time_each_side';

  // Rep state
  const [side, setSide] = useState('left'); // 'left' or 'right'
  const [leftTotal, setLeftTotal] = useState(0);
  const [rightTotal, setRightTotal] = useState(0);
  const [leftFirst, setLeftFirst] = useState(null); // null | true | false (true = hit target on first log)
  const [rightFirst, setRightFirst] = useState(null);
  const [inputVal, setInputVal] = useState(ex.target);

  // Time state
  const [timerSec, setTimerSec] = useState(ex.target);
  const [timerRunning, setTimerRunning] = useState(false);
  const [timerStartedFresh, setTimerStartedFresh] = useState(false); // tracks whether first run completed without quitting early
  const [leftTimeFinished, setLeftTimeFinished] = useState(false);

  // Rest state
  const [restRemaining, setRestRemaining] = useState(0);
  const [restRunning, setRestRunning] = useState(false);

  // Reset working state when set index changes or exercise changes
  useEffect(() => {
    setSide('left');
    setLeftTotal(0); setRightTotal(0);
    setLeftFirst(null); setRightFirst(null);
    setInputVal(ex.target);
    setTimerSec(ex.target);
    setTimerRunning(false);
    setTimerStartedFresh(false);
    setLeftTimeFinished(false);
  }, [nextIdx, exerciseId]);

  // Timer ticker
  useEffect(() => {
    if (!timerRunning) return;
    if (timerSec <= 0) return;
    const t = setTimeout(()=> setTimerSec(s => s-1), 1000);
    return () => clearTimeout(t);
  }, [timerRunning, timerSec]);

  // Rest ticker
  useEffect(() => {
    if (!restRunning) return;
    if (restRemaining <= 0) { setRestRunning(false); return; }
    const t = setTimeout(()=> setRestRemaining(r=>r-1), 1000);
    return () => clearTimeout(t);
  }, [restRunning, restRemaining]);

  // Time-based: detect side completion (hits 0)
  useEffect(() => {
    if (!isTime) return;
    if (timerRunning && timerSec <= 0){
      // Side complete by full timer
      handleTimeComplete(true /* fullTimer */);
    }
  }, [timerSec, timerRunning, isTime]);

  function handleTimeComplete(fullTimer){
    // fullTimer: did the timer reach zero (true) or did user click "done early" (false)
    setTimerRunning(false);
    if (ex.type === 'time'){
      // single phase
      const hitFirst = fullTimer && timerStartedFresh;
      finishSet({ hitFirstAttempt: hitFirst });
    } else {
      // time_each_side
      if (side === 'left'){
        setLeftTimeFinished(true);
        setLeftFirst(fullTimer && timerStartedFresh);
        setSide('right');
        setTimerSec(ex.target);
        setTimerStartedFresh(false);
        setTimerRunning(false);
      } else {
        const rFirst = fullTimer && timerStartedFresh;
        setRightFirst(rFirst);
        const hitFirst = leftFirst===true && rFirst===true;
        finishSet({ hitFirstAttempt: hitFirst });
      }
    }
  }

  function startTimer(){
    if (timerSec === ex.target && !timerRunning) setTimerStartedFresh(true);
    setTimerRunning(true);
  }

  function logReps(){
    const n = Math.max(0, Math.floor(Number(inputVal)||0));
    if (n === 0) return;
    if (side === 'left'){
      const newTotal = leftTotal + n;
      if (leftFirst === null) setLeftFirst(n >= ex.target); // first log
      setLeftTotal(newTotal);
      setInputVal(Math.max(1, ex.target - newTotal));
      if (newTotal >= ex.target){
        if (ex.type === 'reps_each_side'){
          // switch to right side
          setSide('right');
          setInputVal(ex.target);
        } else {
          // single side reps: set complete
          finishSet({ hitFirstAttempt: (leftFirst===null ? n>=ex.target : leftFirst) });
        }
      }
    } else {
      const newTotal = rightTotal + n;
      if (rightFirst === null) setRightFirst(n >= ex.target);
      setRightTotal(newTotal);
      setInputVal(Math.max(1, ex.target - newTotal));
      if (newTotal >= ex.target){
        const lFirst = leftFirst===true;
        const rFirst = (rightFirst===null ? n>=ex.target : rightFirst);
        finishSet({ hitFirstAttempt: lFirst && rFirst });
      }
    }
  }

  function finishSet({ hitFirstAttempt }){
    dispatch({ type:'COMPLETE_SET', exerciseId, setIndex: nextIdx, hitFirstAttempt });
    // Start rest timer (skip rest if last set)
    const isLastSet = nextIdx === totalSets - 1;
    if (!isLastSet){
      setRestRemaining(ex.restSeconds);
      setRestRunning(true);
    }
  }

  function bump(d){
    setInputVal(v => Math.max(0, Math.floor(Number(v)||0) + d));
  }

  // ===== Render =====
  if (allDone){
    return (
      <div>
        <div className="header-bar">
          <button className="back-btn" onClick={()=>navigate({name:'session'})}>← Back to session</button>
          <span className="chip">{ex.pattern}</span>
        </div>
        <h1>{ex.name}</h1>
        <div className="card" style={{marginTop:12, textAlign:'center', padding:24, borderColor:'var(--green)'}}>
          <div style={{fontSize:48, color:'var(--green)'}}>✓</div>
          <h2 style={{marginTop:8, color:'var(--green)'}}>Exercise done</h2>
          <p className="help" style={{marginTop:6}}>{ex.sets} of {ex.sets} sets logged.</p>
        </div>
        <button className="btn btn-primary" style={{marginTop:14}} onClick={()=>navigate({name:'session'})}>Back to session</button>
      </div>
    );
  }

  return (
    <div>
      <div className="header-bar">
        <button className="back-btn" onClick={()=>navigate({name:'session'})}>← Session</button>
        <span className="chip">{ex.pattern}</span>
      </div>

      <h1 style={{marginBottom:4}}>{ex.name}</h1>
      <div className="row" style={{gap:6, marginBottom:12}}>
        {Array.from({length: totalSets}).map((_,i) => (
          <Pip key={i} filled={i < completedSets}/>
        ))}
        <span className="label" style={{marginLeft:8}}>Set {completedSets+1} of {totalSets} · {ex.targetLabel}</span>
      </div>

      {restRunning ? (
        <RestPanel remaining={restRemaining} total={ex.restSeconds} onSkip={()=>{ setRestRunning(false); setRestRemaining(0); }}/>
      ) : (
        <>
          {isEachSide && (
            <div className="side-banner">{side === 'left' ? '← LEFT SIDE' : 'RIGHT SIDE →'}</div>
          )}
          {isReps ? (
            <RepLogger
              ex={ex}
              side={side}
              total={side==='left'?leftTotal:rightTotal}
              inputVal={inputVal}
              setInputVal={setInputVal}
              bump={bump}
              logReps={logReps}
            />
          ) : (
            <TimePanel
              ex={ex}
              timerSec={timerSec}
              running={timerRunning}
              onStart={startTimer}
              onPause={()=>setTimerRunning(false)}
              onReset={()=>{ setTimerSec(ex.target); setTimerRunning(false); setTimerStartedFresh(false); }}
              onDoneEarly={()=>handleTimeComplete(false)}
              side={side}
            />
          )}
          <p className="help" style={{textAlign:'center', marginTop:14}}>Push for the full {ex.target}{isTime?'s':''} in one go if you can.</p>
        </>
      )}

      <details className="card" style={{marginTop:18, padding:14}}>
        <summary style={{cursor:'pointer', fontFamily:'Rajdhani', fontWeight:700, color:'var(--gold)', textTransform:'uppercase', letterSpacing:'.06em', fontSize:13}}>Technique guide</summary>
        <ol className="technique" style={{marginTop:10, paddingLeft:20}}>
          {ex.steps.map((s,i)=><li key={i}>{s}</li>)}
        </ol>
        <h4 style={{marginTop:14, color:'var(--gold)', fontSize:12, letterSpacing:'.1em'}}>COACHING CUES</h4>
        <ul style={{marginTop:6, paddingLeft:20}}>
          {ex.coachingCues.map((s,i)=><li className="cue" key={i}>{s}</li>)}
        </ul>
        <h4 style={{marginTop:12, color:'var(--gold)', fontSize:12, letterSpacing:'.1em'}}>QUICK CUES</h4>
        <p style={{marginTop:4}}>{ex.cues.join(' · ')}</p>
      </details>
    </div>
  );
}

function Pip({ filled }){ return <span className={`pip ${filled?'on':''}`}/> }

function RepLogger({ ex, total, inputVal, setInputVal, bump, logReps }){
  const target = ex.target;
  const remaining = Math.max(0, target - total);
  return (
    <div className="card" style={{textAlign:'center', padding:18}}>
      <div className="big-num">{total}<small> / {target}</small></div>
      <div className="label" style={{marginTop:6}}>{remaining===0?'TARGET HIT':`${remaining} to go`}</div>

      <div className="row" style={{marginTop:18, justifyContent:'center', gap:12, alignItems:'center'}}>
        <button className="stepper-btn" onClick={()=>bump(-1)}>−</button>
        <input
          className="num-input"
          type="number"
          inputMode="numeric"
          value={inputVal}
          onFocus={e=>e.target.select()}
          onChange={e=>setInputVal(e.target.value === '' ? '' : Math.max(0, Math.floor(Number(e.target.value))))}
          style={{maxWidth:140}}
        />
        <button className="stepper-btn" onClick={()=>bump(1)}>+</button>
      </div>

      <div className="row" style={{marginTop:10, gap:6}}>
        <button className="quick-btn" onClick={()=>bump(1)}>+1</button>
        <button className="quick-btn" onClick={()=>bump(5)}>+5</button>
        <button className="quick-btn" onClick={()=>setInputVal(target)}>Full</button>
      </div>

      <button className="btn btn-primary" style={{marginTop:14}} onClick={logReps} disabled={(Number(inputVal)||0) === 0}>
        Log {(Number(inputVal)||0)} rep{(Number(inputVal)||0)===1?'':'s'}

    </div>
  );
}

function CalendarScreen({ state, navigate }){
  const today = new Date(); today.setHours(0,0,0,0);
  const completedDays = new Set(state.sessions.filter(s=>s.completed).map(s=>s.date));
  const ticksTarget = state.profile.level === 'pro' ? 5 : 4;

  // Build 18-week grid
  const weeks = [];
  for (let w=0; w<PROGRAMME_WEEKS; w++){
    const days = [];
    for (let d=0; d<7; d++){
      const dt = addDays(PROGRAMME_START, w*7 + d);
      // Only show day in week 18 if it is Mon (calendar ends Mon Aug 31)
      if (w === 17 && d > 0) { days.push(null); continue; }
      days.push(dt);
    }
    weeks.push(days);
  }

  return (
    <div>
      <div className="header-bar">
        <button className="back-btn" onClick={()=>navigate({name:'home'})}>← Home</button>
        <span className="chip">CALENDAR</span>
      </div>
      <h1>Score Sheet</h1>
      <p className="help" style={{marginBottom:10}}>Tick every session. Thursdays = touch rugby. {ticksTarget} ticks/week target ({state.profile.level}).</p>

      <div className="cal-grid" style={{marginBottom:6}}>
        <div className="cal-head">WK</div>
        {['M','T','W','T','F','S','S'].map((d,i)=>(<div key={i} className="cal-head">{d}</div>))}
        <div className="cal-head">/{ticksTarget}</div>
      </div>

      {weeks.map((days, wi) => {
        let weekTicks = 0;
        const cells = days.map((d, di) => {
          if (!d) return <div key={di} className="cal-cell" style={{visibility:'hidden'}}/>;
          const k = dateKey(d);
          const done = completedDays.has(k);
          const thursday = isThursday(d);
          const bh = BANK_HOLIDAYS.has(k);
          if (done) weekTicks++;
          // Thursday touch rugby is also counted as a tick if we want — for now, count completed sessions only.
          const cls = ['cal-cell'];
          if (thursday) cls.push('thu');
          if (bh) cls.push('bh');
          if (dateKey(d)===dateKey(today)) cls.push('today');
          if (done) cls.push('done');
          return (
            <div key={di} className={cls.join(' ')}>
              <div className="cal-day">{d.getDate()}{d.getDate()===1?` ${d.toLocaleDateString('en-GB',{month:'short'})}`:''}</div>
              {bh && <span className="cal-bh">BH</span>}
              {thursday && !bh && <span className="cal-ball"><RugbyBall size={9}/></span>}
              {done && <span className="cal-tick">✓</span>}
            </div>
          );
        });
        return (
          <div className="cal-grid" key={wi} style={{marginBottom:2}}>
            <div className="cal-week">{wi+1}</div>
            {cells}
            <div className="cal-tally">{weekTicks}</div>
          </div>
        );
      })}

      <div className="row" style={{marginTop:16, gap:14, flexWrap:'wrap'}}>
        <span className="row" style={{gap:4, fontSize:12}}><span className="cal-cell thu" style={{padding:'2px 6px'}}><RugbyBall size={8}/></span> Touch rugby</span>
        <span className="row" style={{gap:4, fontSize:12}}><span className="cal-cell bh" style={{padding:'2px 6px'}}>BH</span> Bank holiday</span>
        <span className="row" style={{gap:4, fontSize:12}}><span className="cal-cell done" style={{padding:'2px 6px'}}>✓</span> Done</span>
      </div>
    </div>
  );
}

// =================== APP / REDUCER ===================
function reducer(state, action){
  switch(action.type){
    case 'COMPLETE_SETUP': {
      return { ...state, profile: action.profile };
    }
    case 'START_SESSION': {
      return { ...state, currentSession: action.session };
    }
    case 'COMPLETE_SET': {
      const { exerciseId, setIndex, hitFirstAttempt } = action;
      const cs = state.currentSession;
      const exData = cs.exercises[exerciseId];
      const newSets = exData.sets.map((s,i) => i===setIndex ? { complete:true, hitFirstAttempt } : s);
      const newCs = {
        ...cs,
        exercises: { ...cs.exercises, [exerciseId]: { sets: newSets } }
      };
      const xpDelta = 10 + (hitFirstAttempt ? 5 : 0);
      return {
        ...state,
        currentSession: newCs,
        stats: { ...state.stats, xp: state.stats.xp + xpDelta, totalSets: state.stats.totalSets + 1 },
        perExerciseSets: { ...state.perExerciseSets, [exerciseId]: (state.perExerciseSets[exerciseId]||0) + 1 }
      };
    }
    case 'COMPLETE_SESSION': {
      const cs = state.currentSession;
      const exs = EXERCISES[cs.level];
      let setCount = 0; let firstAttempts = 0;
      for (const ex of exs){
        const ed = cs.exercises[ex.id];
        for (const s of ed.sets){ if (s.complete) { setCount++; if (s.hitFirstAttempt) firstAttempts++; } }
      }
      const perfect = (setCount === exs.reduce((a,e)=>a+e.sets,0)) && firstAttempts === setCount;
      const sessionXp = 25 + (perfect ? 25 : 0);
      const summary = {
        date: cs.date, level: cs.level, completed: true, setCount,
        xp: sessionXp + setCount*10, perfect
      };
      return {
        ...state,
        currentSession: null,
        sessions: [...state.sessions, summary],
        stats: {
          ...state.stats,
          xp: state.stats.xp + sessionXp,
          totalSessions: state.stats.totalSessions + 1
        },
        sessionsByLevel: { ...state.sessionsByLevel, [cs.level]: (state.sessionsByLevel[cs.level]||0)+1 }
      };
    }
    case 'EARN_ACHIEVEMENT': {
      if (state.achievements.includes(action.id)) return state;
      return { ...state, achievements: [...state.achievements, action.id] };
    }
    case 'CHANGE_LEVEL': {
      const movedUp = LEVEL_RANK[action.level] > LEVEL_RANK[state.profile.level];
      const ach = (movedUp && !state.achievements.includes('levelled_up'))
        ? [...state.achievements, 'levelled_up']
        : state.achievements;
      return { ...state, profile: { ...state.profile, level: action.level }, achievements: ach };
    }
    case 'SET_QUALIFIED': {
      return { ...state, qualifiedFor: action.qualifiedFor };
    }
    default: return state;
  }
}

function App(){
  const [state, setState] = useState(loadState);
  const [route, setRoute] = useState(() => {
    const s = loadState();
    return { name: s.profile ? 'home' : 'setup' };
  });
  const [toast, showToast] = useToast();

  // Persist on every change
  useEffect(() => { saveState(state); }, [state]);

  function dispatch(action){
    setState(s => reducer(s, action));
  }

  // Achievement evaluation after every state change
  useEffect(() => {
    const earned = new Set(state.achievements);
    const newlyEarned = [];

    function maybe(id, cond){
      if (cond && !earned.has(id)){ newlyEarned.push(id); earned.add(id); }
    }

    maybe('first_session', state.stats.totalSessions >= 1);
    maybe('hat_trick', state.stats.totalSessions >= 3);
    maybe('veteran', state.stats.totalSessions >= 10);
    maybe('century', state.stats.totalSets >= 100);
    maybe('iron_will', Math.max(...Object.values(state.sessionsByLevel||{}).concat([0])) >= 10);

    const lastSession = state.sessions[state.sessions.length-1];
    if (lastSession && lastSession.perfect){
      maybe('perfect', true);
    }

    // Streak
    const streak = computeStreak(state.sessions);
    maybe('streak_3', streak >= 3);
    maybe('streak_5', streak >= 5);

    // Week warrior — sessions in current ISO week (the one of the most recent session)
    if (lastSession){
      const sd = new Date(lastSession.date);
      const ws = startOfISOWeek(sd);
      const weekKey = dateKey(ws);
      const cnt = state.sessions.filter(s => dateKey(startOfISOWeek(new Date(s.date))) === weekKey).length;
      maybe('week_warrior', cnt >= 3);
    }

    if (newlyEarned.length){
      // Add them and toast
      setState(s => ({ ...s, achievements: [...s.achievements, ...newlyEarned] }));
      const a = ACHIEVEMENTS.find(x=>x.id===newlyEarned[0]);
      showToast({ kind:'achievement', title: a.name, desc: a.desc, emoji: a.emoji });
      fireConfetti();
    }

    // Qualification detection — fire a toast first time each threshold is crossed
    const currentQual = computeQualifications(state.perExerciseSets);
    const prevQual = state.qualifiedFor || { advanced:false, pro:false };
    if (currentQual.advanced !== prevQual.advanced || currentQual.pro !== prevQual.pro){
      setState(s => ({ ...s, qualifiedFor: currentQual }));
      if (currentQual.advanced && !prevQual.advanced){
        showToast({ kind:'qual', emoji:'🏆', title:'Qualified for Advanced', desc:'Move up in Settings if you’re ready.' });
        fireConfetti();
      }
      if (currentQual.pro && !prevQual.pro){
        showToast({ kind:'qual', emoji:'🏆', title:'Qualified for Pro', desc:'The top level is unlocked. Move up in Settings if you’re ready.' });
        fireConfetti();
      }
    }
  }, [state]);

  function navigate(r){ setRoute(r); window.scrollTo(0,0); }

  // Routing
  let body;
  if (!state.profile || route.name === 'setup'){
    body = <SetupScreen onComplete={(profile)=>{ dispatch({type:'COMPLETE_SETUP', profile}); navigate({name:'home'}); }}/>;
  } else if (route.name === 'home'){
    body = <HomeScreen state={state} navigate={navigate} dispatch={dispatch}/>;
  } else if (route.name === 'session'){
    body = <SessionScreen state={state} navigate={navigate} dispatch={dispatch}/>;
  } else if (route.name === 'exercise'){
    body = <ExerciseScreen state={state} dispatch={dispatch} navigate={navigate} exerciseId={route.id}/>;
  } else if (route.name === 'session_done'){
    body = <SessionDoneScreen state={state} navigate={navigate}/>;
  } else if (route.name === 'calendar'){
    body = <CalendarScreen state={state} navigate={navigate}/>;
  } else if (route.name === 'sets'){
    body = <SetSheetScreen state={state} navigate={navigate}/>;
  } else if (route.name === 'achievements'){
    body = <AchievementsScreen state={state} navigate={navigate}/>;
  } else if (route.name === 'settings'){
    body = <SettingsScreen state={state} dispatch={dispatch} navigate={navigate}/>;
  } else {
    body = <HomeScreen state={state} navigate={navigate} dispatch={dispatch}/>;
  }

  return (
    <div className="app">
      {body}
      {toast && (
        <div className="toast">
          <div className="row" style={{gap:10}}>
            <div style={{fontSize:24}}>{toast.emoji}</div>
            <div>
              <strong>{toast.title}</strong>
              <small>{toast.desc}</small>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
