// localStorage shim that matches the artifact storage API
window.storage = window.storage || {
  get: async (key) => {
    const val = localStorage.getItem(key);
    if (val === null) throw new Error('Key not found');
    return { value: val, key };
  },
  set: async (key, value) => { localStorage.setItem(key, value); return { value, key }; },
  delete: async (key) => { localStorage.removeItem(key); return { deleted: true, key }; },
  list: async (prefix) => {
    const keys = [];
    for (let i=0; i<localStorage.length; i++) { const k = localStorage.key(i); if (!prefix || k.startsWith(prefix)) keys.push(k); }
    return { keys };
  }
};

const { useState, useEffect, useRef } = React;


const S = `
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#F2A900;--gold-d:rgba(242,169,0,.13);--gold-b:rgba(242,169,0,.3);
  --maroon:#8B1A2C;--maroon-d:rgba(139,26,44,.25);
  --green:#00A651;--green-d:rgba(0,166,81,.15);
  --red:#C8102E;
  --bg:#07090D;--bg2:#0D1117;--bg3:#141820;--bg4:#1C2230;
  --border:#1E2530;--border2:#2A3040;
  --text:#EDE8E3;--text2:#7B8494;--text3:#3E4555;
  --r:12px;--fh:'Rajdhani',sans-serif;--fb:'Barlow',sans-serif;--fc:'Barlow Condensed',sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--fb);}
.app{max-width:430px;margin:0 auto;min-height:100vh;overflow-x:hidden;position:relative;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%,100%{transform:scale(1)}40%{transform:scale(1.25)}70%{transform:scale(.95)}}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-24px) scale(.92)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.fade{animation:fadeUp .3s ease}

.btn{font-family:var(--fc);font-weight:800;letter-spacing:2px;font-size:17px;border:none;border-radius:var(--r);padding:16px;cursor:pointer;width:100%;text-transform:uppercase;transition:transform .1s,opacity .1s;}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-gold{background:var(--gold);color:#07090D;}
.btn-green{background:var(--green);color:#fff;}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border2);}
.btn-sm{font-size:13px;padding:11px 16px;letter-spacing:1px;}

.setup{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,rgba(139,26,44,.4) 0%,transparent 60%),var(--bg);padding:40px 20px 40px;}
.logo-badge{display:inline-block;background:var(--gold);color:#07090D;font-family:var(--fc);font-weight:800;font-size:10px;letter-spacing:3px;padding:4px 12px;border-radius:4px;margin-bottom:14px;}
.logo-title{font-family:var(--fh);font-size:52px;font-weight:700;line-height:1;color:var(--gold);margin-bottom:6px;}
.logo-sub{font-family:var(--fc);font-size:13px;letter-spacing:2px;color:var(--text2);margin-bottom:36px;}
.welcome-block{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:24px;font-size:14px;line-height:1.6;color:var(--text2);}
.welcome-block strong{color:var(--gold);}
.fl{margin-bottom:20px}
.fl label{display:block;font-family:var(--fc);font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text2);text-transform:uppercase;margin-bottom:8px;}
.fl input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:14px 16px;color:var(--text);font-size:17px;font-family:var(--fb);outline:none;transition:border .2s;}
.fl input:focus{border-color:var(--gold);}
.fl input::placeholder{color:var(--text3);}
.clubs-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.club-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 6px;font-family:var(--fc);font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--text2);cursor:pointer;text-align:center;transition:all .2s;word-break:break-word;line-height:1.2;}
.club-btn.sel{border-color:var(--gold);background:var(--gold-d);color:var(--gold);}

.home-hdr{padding:24px 20px 0;background:linear-gradient(180deg,#0D1117 0%,transparent 100%);}
.home-greet small{font-family:var(--fc);font-size:11px;letter-spacing:2px;color:var(--text2);}
.home-greet h2{font-family:var(--fh);font-size:36px;font-weight:700;line-height:1.05;}
.home-greet h2 span{color:var(--gold);}
.xp-block{margin:14px 0 0;}
.xp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.xp-top span{font-family:var(--fc);font-size:11px;letter-spacing:1px;color:var(--text2);}
.xp-top strong{font-family:var(--fc);font-size:15px;font-weight:800;color:var(--gold);}
.xp-bar{height:5px;background:var(--bg4);border-radius:3px;}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--maroon),var(--gold));border-radius:3px;transition:width 1.2s ease;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px;}
.sc{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:12px 10px;text-align:center;}
.sc-val{font-family:var(--fc);font-size:30px;font-weight:800;color:var(--gold);line-height:1;}
.sc-lbl{font-size:11px;color:var(--text2);margin-top:2px;}
.sec{padding:0 20px;}
.sec-lbl{font-family:var(--fc);font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text2);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.session-cta{background:linear-gradient(135deg,var(--maroon) 0%,#460D18 100%);border:1px solid rgba(242,169,0,.2);border-radius:16px;padding:22px;margin-bottom:20px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s;}
.session-cta::after{content:'';position:absolute;top:-40px;right:-20px;width:160px;height:160px;background:radial-gradient(circle,rgba(242,169,0,.12) 0%,transparent 70%);}
.session-cta:active{transform:scale(.98);}
.session-cta h3{font-family:var(--fh);font-size:24px;font-weight:700;margin-bottom:4px;}
.session-cta p{font-size:13px;color:rgba(237,232,227,.6);margin-bottom:18px;}
.cta-inner{display:inline-block;background:var(--gold);color:#07090D;font-family:var(--fc);font-weight:800;font-size:13px;letter-spacing:2px;padding:10px 20px;border-radius:6px;}
.phase-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;}
.phase-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.phase-name{font-family:var(--fh);font-size:18px;font-weight:700;}
.phase-chip{font-family:var(--fc);font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:10px;background:var(--bg4);color:var(--gold);text-transform:uppercase;}
.phase-progress-row{display:flex;gap:6px;}
.phase-pill{flex:1;height:5px;border-radius:3px;background:var(--bg4);}
.phase-pill.f{background:var(--green);}
.phase-pill.a{background:#FFB800;}
.phase-pill.p{background:var(--gold);}
.phase-note{font-size:12px;color:var(--text2);margin-top:8px;}
.hist-empty{text-align:center;padding:20px;color:var(--text2);font-size:14px;}
.hist-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.hi-l small{font-size:11px;color:var(--text2);}
.hi-l strong{display:block;font-family:var(--fh);font-size:16px;font-weight:600;}
.hi-xp{font-family:var(--fc);font-size:17px;font-weight:800;color:var(--gold);}

.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:90;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;cursor:pointer;opacity:.4;transition:opacity .15s;}
.bni.on{opacity:1;}
.bni-icon{font-size:20px;}
.bni-lbl{font-family:var(--fc);font-size:9px;letter-spacing:1px;color:var(--gold);}

.sess-hdr{padding:22px 20px 16px;background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);}
.back{background:none;border:none;color:var(--gold);font-family:var(--fc);font-size:13px;letter-spacing:1px;cursor:pointer;padding:0;margin-bottom:12px;display:flex;align-items:center;gap:5px;}
.sess-hdr h2{font-family:var(--fh);font-size:28px;font-weight:700;margin-bottom:4px;}
.sess-hdr p{font-size:13px;color:var(--text2);}
.prog-bar{height:4px;background:var(--bg4);border-radius:2px;margin-top:12px;}
.prog-fill{height:100%;background:var(--green);border-radius:2px;transition:width .6s ease;}
.ex-list{padding:6px 20px 20px;}
.ex-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .2s;}
.ex-card.done{border-color:var(--green);background:rgba(0,166,81,.07);}
.ex-chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--bg4);}
.ex-card.done .ex-chk{background:var(--green);border-color:var(--green);}
.ex-info{flex:1;min-width:0;}
.ex-cat{font-family:var(--fc);font-size:10px;letter-spacing:2px;color:var(--text2);}
.ex-name{font-family:var(--fh);font-size:18px;font-weight:600;line-height:1.1;}
.ex-meta{font-size:12px;color:var(--text2);margin-top:2px;}
.ex-tier{display:inline-block;font-family:var(--fc);font-size:9px;font-weight:700;letter-spacing:1px;padding:1px 6px;border-radius:8px;margin-left:6px;}
.ex-tier.f{background:rgba(0,166,81,.2);color:var(--green);}
.ex-tier.a{background:rgba(255,184,0,.2);color:#FFB800;}
.ex-tier.p{background:var(--gold-d);color:var(--gold);}
.ex-arr{color:var(--text3);font-size:20px;}

.exd{background:var(--bg);min-height:100vh;padding-bottom:100px;}
.exd-hdr{background:linear-gradient(135deg,#0D1117 0%,#14091A 100%);padding:20px;}
.exd-cat{font-family:var(--fc);font-size:11px;letter-spacing:3px;color:var(--text2);text-transform:uppercase;margin-bottom:6px;}
.exd-title{font-family:var(--fh);font-size:34px;font-weight:700;line-height:1;}
.exd-note{font-size:13px;color:var(--gold);margin-top:4px;}
.sets-pips{display:flex;gap:6px;padding:16px 20px 8px;}
.pip{flex:1;height:6px;border-radius:3px;background:var(--bg4);transition:background .3s;}
.pip.done{background:var(--green);}
.pip.cur{background:var(--gold);}
.setlog{padding:0 20px;}
.setlog-hdr{font-family:var(--fc);font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text2);text-transform:uppercase;margin-bottom:12px;}
.target-box{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:16px;text-align:center;margin-bottom:14px;}
.target-num{font-family:var(--fc);font-size:64px;font-weight:800;color:var(--gold);line-height:1;}
.target-lbl{font-size:13px;color:var(--text2);margin-top:2px;}

.var-tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:4px;}
.var-tab{flex:1;background:transparent;border:none;padding:10px 8px;border-radius:8px;color:var(--text2);font-family:var(--fc);font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s;text-align:center;line-height:1.1;}
.var-tab.active{background:var(--gold);color:#07090D;}
.var-tab .vt-name{font-size:12px;}
.var-tab .vt-count{font-family:var(--fc);font-size:14px;font-weight:800;}

.cumul-bar{background:var(--gold-d);border:1px solid var(--gold-b);border-radius:8px;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:13px;color:var(--text2);}
.cumul-bar strong{font-family:var(--fc);font-size:15px;font-weight:800;color:var(--gold);}

.rep-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.rep-adj{width:54px;height:54px;border-radius:50%;border:2px solid var(--border2);background:var(--bg3);color:var(--text);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.rep-adj:active{background:var(--bg4);transform:scale(.93);}
.rep-input{flex:1;text-align:center;font-family:var(--fc);font-size:80px;font-weight:800;line-height:1;background:transparent;border:none;color:var(--text);width:100%;outline:none;-moz-appearance:textfield;padding:0;}
.rep-input::-webkit-outer-spin-button,.rep-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.rep-input.empty{color:var(--text3);}
.rep-input.good{color:var(--green);}
.rep-hint{text-align:center;font-size:12px;color:var(--text2);margin-bottom:14px;min-height:18px;}
.rep-hint.warn{color:#F0B429;}
.rep-hint.good{color:var(--green);}
.btn-gap{margin-top:8px;}

.timer-wrap{padding:10px 20px 0;text-align:center;}
.timer-side-lbl{font-family:var(--fc);font-size:12px;letter-spacing:3px;color:var(--text2);text-transform:uppercase;margin-bottom:12px;}
.timer-ring-wrap{display:inline-block;position:relative;margin-bottom:8px;}
.timer-inner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.timer-inner .t-num{font-family:var(--fc);font-size:56px;font-weight:800;color:var(--gold);line-height:1;}
.timer-inner .t-lbl{font-size:11px;color:var(--text2);letter-spacing:1px;}

.rest-ov{position:fixed;inset:0;background:rgba(7,9,13,.94);display:flex;align-items:center;justify-content:center;z-index:200;}
.rest-card{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:40px 32px;text-align:center;width:300px;max-width:90vw;}
.rest-lbl{font-family:var(--fc);font-size:11px;letter-spacing:3px;color:var(--text2);text-transform:uppercase;margin-bottom:14px;}
.rest-num{font-family:var(--fc);font-size:96px;font-weight:800;color:var(--gold);line-height:1;margin-bottom:6px;}
.rest-sub{font-size:13px;color:var(--text2);margin-bottom:24px;}
.btn-skip{background:none;border:1px solid var(--border2);color:var(--text2);font-family:var(--fc);font-size:13px;letter-spacing:1px;padding:10px 22px;border-radius:var(--r);cursor:pointer;}

.ach-pop{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1.5px solid var(--gold);border-radius:16px;padding:14px 18px;width:340px;max-width:calc(100vw - 32px);z-index:300;animation:slideDown .4s cubic-bezier(.34,1.56,.64,1);}
.ach-inner{display:flex;align-items:center;gap:12px;}
.ach-emoji{font-size:36px;animation:pop .6s ease;}
.ach-txt small{font-family:var(--fc);font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;}
.ach-txt strong{display:block;font-family:var(--fh);font-size:20px;font-weight:700;line-height:1.1;}
.ach-txt p{font-size:12px;color:var(--text2);}
.ach-xp{margin-left:auto;font-family:var(--fc);font-size:15px;font-weight:800;color:var(--gold);white-space:nowrap;}

.tech-sec{padding:16px 20px;}
.tech-tog{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;width:100%;text-align:left;transition:border-color .2s;}
.tech-tog span{font-family:var(--fc);font-size:12px;font-weight:700;letter-spacing:1px;color:var(--text2);text-transform:uppercase;}
.tech-tog.open{border-radius:var(--r) var(--r) 0 0;border-color:var(--gold);}
.tech-body{background:var(--bg3);border:1px solid var(--gold);border-top:none;border-radius:0 0 var(--r) var(--r);padding:16px;}
.tech-block-title{font-family:var(--fc);font-size:11px;font-weight:700;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:8px;margin-top:14px;}
.tech-block-title:first-child{margin-top:0;}
.tech-step{display:flex;gap:10px;margin-bottom:8px;font-size:13px;line-height:1.5;color:var(--text2);}
.tech-step-n{font-family:var(--fc);font-weight:800;font-size:12px;color:var(--gold);min-width:18px;}
.tech-cue{display:flex;gap:8px;background:var(--gold-d);border-left:3px solid var(--gold);padding:9px 12px;border-radius:0 6px 6px 0;margin-bottom:6px;font-size:12px;line-height:1.5;font-style:italic;color:var(--text2);}
.tech-cue::before{content:'💡';flex-shrink:0;}

.comp{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px 100px;text-align:center;background:radial-gradient(ellipse at 50% 20%,rgba(0,166,81,.18) 0%,transparent 55%),var(--bg);}
.comp-emoji{font-size:68px;animation:pop .7s ease;margin-bottom:12px;}
.comp-title{font-family:var(--fh);font-size:52px;font-weight:700;line-height:1;margin-bottom:6px;color:var(--gold);}
.comp-msg{font-size:15px;color:var(--text2);margin-bottom:28px;line-height:1.5;}
.unlock-banner{background:linear-gradient(135deg,#F2A900 0%,#FFB800 100%);border-radius:16px;padding:18px 22px;margin-bottom:20px;color:#07090D;text-align:left;display:flex;align-items:center;gap:14px;width:100%;box-shadow:0 8px 24px rgba(242,169,0,.3);animation:pop .8s ease;}
.unlock-icon{font-size:36px;}
.unlock-txt small{font-family:var(--fc);font-size:11px;letter-spacing:2px;font-weight:800;}
.unlock-txt strong{display:block;font-family:var(--fh);font-size:18px;font-weight:700;line-height:1.1;}
.xp-card{background:var(--gold-d);border:1px solid var(--gold-b);border-radius:16px;padding:20px 32px;margin-bottom:16px;}
.xp-card-num{font-family:var(--fc);font-size:72px;font-weight:800;color:var(--gold);line-height:1;}
.xp-card-lbl{font-size:13px;color:var(--text2);letter-spacing:1px;}
.comp-stats{display:flex;gap:10px;width:100%;margin-bottom:28px;}
.comp-sc{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center;}
.comp-sc-val{font-family:var(--fc);font-size:28px;font-weight:800;color:var(--text);line-height:1;}
.comp-sc-lbl{font-size:11px;color:var(--text2);margin-top:2px;}

.achs-hdr{padding:24px 20px 16px;}
.achs-hdr h2{font-family:var(--fh);font-size:30px;font-weight:700;}
.achs-grid{padding:0 20px 100px;display:grid;gap:10px;}
.ach-row{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;transition:all .2s;}
.ach-row.earned{border-color:var(--gold);background:var(--gold-d);}
.ach-row.locked{opacity:.35;}
.ach-row-em{font-size:28px;}
.ach-row-inf small{font-size:11px;color:var(--text2);}
.ach-row-inf strong{display:block;font-family:var(--fh);font-size:16px;font-weight:600;}
.ach-row-xp{margin-left:auto;font-family:var(--fc);font-size:14px;font-weight:800;color:var(--gold);}
.ach-row.locked .ach-row-xp{color:var(--text3);}

/* Calendar */
.cal-hdr{padding:24px 20px 12px;}
.cal-hdr h2{font-family:var(--fh);font-size:30px;font-weight:700;}

// ─── HELPERS ───────────────────────────────────────────────────────────
function defaultProfile(name, clubs) {
  return {
    name, clubs,
    patterns: {
      push:      { tier: "foundation", consecutiveFull: 0, advancedSessionsCompleted: 0 },
      squat:     { tier: "foundation", consecutiveFull: 0, advancedSessionsCompleted: 0 },
      hinge:     { tier: "foundation", consecutiveFull: 0, advancedSessionsCompleted: 0 },
      coresides: { tier: "foundation", consecutiveFull: 0, advancedSessionsCompleted: 0 },
    }
  };
}

function getPhase(profile) {
  // 'foundation' if any foundation pattern still at foundation tier OR advanced patterns missing
  if (!profile?.patterns) return "foundation";
  const allFoundationLeveled = FOUNDATION_PATTERNS.every(p => {
    const t = profile.patterns[p]?.tier;
    return t === "advanced" || t === "pro";
  });
  if (!allFoundationLeveled) return "foundation";
  const allLeveledToPro = ALL_PATTERN_ORDER.every(p => profile.patterns[p]?.tier === "pro");
  if (allLeveledToPro) return "pro";
  return "advanced";
}

function getActivePatternIds(profile) {
  const phase = getPhase(profile);
  return phase === "foundation" ? FOUNDATION_PATTERNS : ALL_PATTERN_ORDER;
}

function getCurrentTarget(profile, patternId) {
  const tier = profile.patterns[patternId]?.tier;
  return PATTERNS[patternId].targets[tier];
}

function getCurrentVariation(profile, patternId) {
  const tier = profile.patterns[patternId]?.tier;
  return PATTERNS[patternId].variations[tier];
}

function getUnlockedVariations(profile, patternId) {
  const tier = profile.patterns[patternId]?.tier;
  const tierIdx = TIER_ORDER.indexOf(tier);
  const result = [];
  TIER_ORDER.slice(0, tierIdx + 1).forEach(t => {
    if (PATTERNS[patternId].variations[t]) result.push(t);
  });
  return result;
}

// Variations that can be MIXED within a set — same target type (reps vs time) only.
// e.g. Push-Up (reps) + Decline Push-Up (reps) = mixable; Side Plank (time) + Hip Dip (reps) = NOT mixable.
function getMixableVariations(profile, patternId) {
  const unlocked = getUnlockedVariations(profile, patternId);
  const currentTier = profile.patterns[patternId]?.tier;
  const currentType = PATTERNS[patternId].targets[currentTier]?.type;
  return unlocked.filter(t => PATTERNS[patternId].targets[t]?.type === currentType);
}

// Did this session "qualify" toward Pro unlock for a given pattern?
// Rule: pattern must be at advanced tier, hit target on every set, AND
// at least 75% of total reps were the advanced (or higher) variation —
// preventing a kid from coasting on easier variations.
function isQualifyingAdvancedSession(sess, patternId) {
  const exData = sess.exercises[patternId];
  if (!exData || exData.tierAtStart !== 'advanced') return false;
  const target = PATTERNS[patternId].targets.advanced;
  const sets = exData.completedSets;
  if (sets.length < target.sets) return false;
  if (!sets.every(s => s.totalReps >= target.reps)) return false;
  const totalReps = sets.reduce((a,s) => a + s.totalReps, 0);
  if (totalReps === 0) return false;
  // Count reps from advanced variation (or higher tier — pro counts too)
  const advReps = sets.reduce((a,s) => {
    if (!s.reps || typeof s.reps !== 'object') return a + s.totalReps; // legacy / no breakdown = all advanced
    return a + (s.reps.advanced || 0) + (s.reps.pro || 0);
  }, 0);
  return advReps / totalReps >= 0.75;
}

function calcStreak(sessions) {
  if (!sessions.length) return 0;
  const sorted = [...sessions].sort((a,b) => new Date(b.date)-new Date(a.date));
  let streak = 0, prev = new Date(); prev.setHours(0,0,0,0);
  for (const s of sorted) {
    const d = new Date(s.date); d.setHours(0,0,0,0);
    const diff = Math.round((prev - d)/86400000);
    if (diff > 1) break;
    if (diff === 0 && streak === 0) { streak = 1; continue; }
    if (diff <= 1) { streak++; prev = d; }
  }
  return streak;
}

function fmtDur(ms) { const m = Math.round(ms/60000); return m < 1 ? '<1 min' : `${m} min`; }
function randFrom(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function sameDay(d1, d2) { return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate(); }

// Calendar config: matches PDF page 6
const CAL_START = new Date(2026, 4, 4); // Mon 4 May 2026
const CAL_WEEKS = 18;
const BANK_HOLIDAYS = ["2026-05-04","2026-05-25","2026-08-31"];
function getCalendar() {
  const weeks = [];
  for (let w = 0; w < CAL_WEEKS; w++) {
    const days = [];
    for (let d = 0; d < 7; d++) {
      // Last week (18) only has Monday
      if (w === 17 && d > 0) { days.push({empty:true}); continue; }
      const date = new Date(CAL_START);
      date.setDate(CAL_START.getDate() + w*7 + d);
      const iso = date.toISOString().split('T')[0];
      days.push({
        date,
        dayOfWeek: d, // 0=Mon
        isThursday: d === 3,
        isBankHoliday: BANK_HOLIDAYS.includes(iso),
        iso
      });
    }
    weeks.push({ num: w+1, days });
  }
  return weeks;
}

function checkAchs(sessions, profile, currentEarned, flags = {}) {
  const newIds = [];
  const totalSets = sessions.reduce((a,s)=>a+(s.totalSets||0),0);
  ACHS.forEach(a => {
    if (currentEarned.has(a.id)) return;
    let earned = false;
    if (a.id === 'first') earned = sessions.length >= 1;
    if (a.id === 'hat3') earned = sessions.length >= 3;
    if (a.id === 'vet10') earned = sessions.length >= 10;
    if (a.id === 'perfect') earned = !!flags.perfectSession;
    if (a.id === 'adv') earned = getPhase(profile) === 'advanced' || getPhase(profile) === 'pro';
    if (a.id === 'pro') earned = ALL_PATTERN_ORDER.some(p => profile.patterns[p]?.tier === 'pro');
    if (a.id === 'week') {
      const weeks = {};
      sessions.forEach(s=>{ const d=new Date(s.date); const wk=`${d.getFullYear()}-W${Math.floor(d.getDate()/7)}-${d.getMonth()}`; weeks[wk]=(weeks[wk]||0)+1; });
      earned = Object.values(weeks).some(v=>v>=3);
    }
    if (a.id === 'c100') earned = totalSets >= 100;
    if (earned) newIds.push(a.id);
  });
  return newIds;
}

function Confetti() {
  const colors = ['#F2A900','#00A651','#C8102E','#8B1A2C','#FFD166','#ffffff'];
  const pieces = Array.from({length:60},(_,i)=>({
    left: Math.random()*100, color: colors[i%colors.length],
    dur: 1.5+Math.random()*2, del: Math.random()*1.2,
    shape: Math.random()>0.5?'50%':'0%'
  }));
  return <div className="confetti-wrap">{pieces.map((p,i)=>(
    <div key={i} className="cp" style={{left:`${p.left}%`,background:p.color,borderRadius:p.shape,'--d':`${p.dur}s`,'--del':`${p.del}s`}} />
  ))}</div>;
}

function TimerRing({secs, total, size=140}) {
  const r = (size-14)/2, circ = 2*Math.PI*r;
  const pct = total>0 ? secs/total : 1;
  return (
    <div className="timer-ring-wrap">
      <svg width={size} height={size}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bg4)" strokeWidth={7}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--gold)" strokeWidth={7}
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct)}
          strokeLinecap="round" transform={`rotate(-90 ${size/2} ${size/2})`}
          style={{transition:'stroke-dashoffset .9s linear'}}/>
      </svg>
      <div className="timer-inner">
        <div className="t-num">{secs}</div>
        <div className="t-lbl">secs</div>
      </div>
    </div>
  );
}

        if (s?.value) setSessions(JSON.parse(s.value));
        if (e?.value) setEarned(new Set(JSON.parse(e.value)));
      } catch {}
      setLoaded(true);
    }
    load();
  }, []);

  useEffect(() => { if (loaded) setScreen(profile ? 'home' : 'setup'); }, [loaded, profile]);

  const saveProfile = async (p) => { try { await window.storage.set('ss3_profile', JSON.stringify(p)); } catch {} };
  const saveSessions = async (s) => { try { await window.storage.set('ss3_sessions', JSON.stringify(s)); } catch {} };
  const saveEarned = async (e) => { try { await window.storage.set('ss3_earned', JSON.stringify([...e])); } catch {} };

  // ── COMPUTED
  const totalXP = sessions.reduce((a,s)=>a+(s.xp||0),0);
  const xpLevel = Math.floor(totalXP/500)+1;
  const xpProgress = (totalXP % 500)/500;
  const streak = calcStreak(sessions);
  const phase = profile ? getPhase(profile) : 'foundation';
  const activePatternIds = profile ? getActivePatternIds(profile) : FOUNDATION_PATTERNS;
  const activePat = activePatId ? PATTERNS[activePatId] : null;
  const activePatTier = activePatId ? profile.patterns[activePatId]?.tier : null;
  const activeTarget = activePatId ? getCurrentTarget(profile, activePatId) : null;
  const activeVariation = activeVar && activePat ? activePat.variations[activeVar] : null;
  const unlockedVars = activePatId ? getUnlockedVariations(profile, activePatId) : [];
  const mixableVars = activePatId ? getMixableVariations(profile, activePatId) : [];

  const currentSetTotal = Object.values(repsByVar).reduce((a,b)=>a+b,0) + pendingReps;

  // ── REST TIMER
  useEffect(() => {
    if (!restState) return;
    if (restState.secs <= 0) {
      setRestState(null); restCb.current?.(); restCb.current = null; return;
    }
    const t = setTimeout(() => setRestState(r => r ? {...r, secs:r.secs-1} : null), 1000);
    return () => clearTimeout(t);
  }, [restState]);

  function startRest(secs, cb) { restCb.current = cb; setRestState({secs, total:secs}); }

  // ── EXERCISE TIMER
  useEffect(() => {
    if (!timerPhase || ['switch','done','right_ready'].includes(timerPhase)) return;
    if (timerSecs <= 0) {
      if (timerPhase === 'left') { setTimerPhase('switch'); setTimeout(()=>setTimerPhase('right_ready'),1500); }
      else if (timerPhase === 'right') { setTimerPhase('done'); }
      return;
    }
    const t = setTimeout(()=>setTimerSecs(s=>s-1),1000);
    return ()=>clearTimeout(t);
  }, [timerPhase, timerSecs]);

  function handleTimerDone() {
    const tier = activePatTier;
    const newSet = { reps: { [tier]: activeTarget.reps }, totalReps: activeTarget.reps, timestamp: Date.now() };
    const newSets = [...activeSession.exercises[activePatId].completedSets, newSet];
    const exDone = newSets.length >= activeTarget.sets;
    const newSess = { ...activeSession, exercises: { ...activeSession.exercises, [activePatId]: { completedSets: newSets, done: exDone } } };
    setActiveSession(newSess);
    setTimerPhase(null);
    if (exDone) startRest(activeTarget.rest, () => setActivePatId(null));
    else { setCurSet(newSets.length+1); startRest(activeTarget.rest, () => {}); }
  }

  // ── SETUP
  function handleSetup() {
    const p = defaultProfile(sName.trim()||'Champ', sClubs);
    setProfile(p); saveProfile(p); setScreen('home');
  }
  function handleReset() {
    if (!confirm('Reset everything? This deletes all your sessions and progress.')) return;
    setProfile(null); setSessions([]); setEarned(new Set());
    saveProfile(null); saveSessions([]); saveEarned(new Set());
    try { window.storage.delete('ss3_profile'); window.storage.delete('ss3_sessions'); window.storage.delete('ss3_earned'); } catch {}
    setScreen('setup');
  }

  // ── START SESSION
  function startSession() {
    const exState = {};
    activePatternIds.forEach(p => { exState[p] = { completedSets: [], done: false, tierAtStart: profile.patterns[p].tier }; });
    setActiveSession({ startTime: Date.now(), exercises: exState, phaseAtStart: phase });
    setActivePatId(null); setScreen('session');
  }

  // ── OPEN EXERCISE
  function openExercise(patId) {
    const exSt = activeSession.exercises[patId];
    const done = exSt.completedSets.length;
    setCurSet(done+1);
    setRepsByVar({}); setPendingReps(0);
    setTimerPhase(null); setTimerSecs(0); setTimerTotal(0);
    setShowTech(false);
    // Default active variation = current tier
    const tier = profile.patterns[patId].tier;
    setActiveVar(tier);
    setActivePatId(patId);
  }

  // ── COMMIT pending reps to active variation
  function commitPending() {
    if (pendingReps === 0) return;
    setRepsByVar(prev => ({ ...prev, [activeVar]: (prev[activeVar]||0) + pendingReps }));
    setPendingReps(0);
  }

  // ── LOG SET
  function tryLogSet() {
    // Commit pending first
    const finalByVar = { ...repsByVar };
    if (pendingReps > 0) finalByVar[activeVar] = (finalByVar[activeVar]||0) + pendingReps;
    const total = Object.values(finalByVar).reduce((a,b)=>a+b,0);
    if (total === 0) return;
    if (total < activeTarget.reps) {
      // Just commit and let them continue
      commitPending();
      return;
    }
    finalizeSet(finalByVar, total);
  }
  function forceComplete() {
    const finalByVar = { ...repsByVar };
    if (pendingReps > 0) finalByVar[activeVar] = (finalByVar[activeVar]||0) + pendingReps;
    const total = Object.values(finalByVar).reduce((a,b)=>a+b,0);
    if (total > 0) finalizeSet(finalByVar, total);
  }
  function finalizeSet(byVar, total) {
    const newSet = { reps: byVar, totalReps: total, timestamp: Date.now() };
    const newSets = [...activeSession.exercises[activePatId].completedSets, newSet];
    const exDone = newSets.length >= activeTarget.sets;
    const newSess = { ...activeSession, exercises: { ...activeSession.exercises, [activePatId]: { ...activeSession.exercises[activePatId], completedSets: newSets, done: exDone } } };
    setActiveSession(newSess);
    setRepsByVar({}); setPendingReps(0);
    if (exDone) startRest(activeTarget.rest, () => setActivePatId(null));
    else startRest(activeTarget.rest, () => setCurSet(newSets.length+1));
  }

  // ── CHECK SESSION DONE
  useEffect(()=>{
    if (!activeSession) return;
    const allDone = activePatternIds.every(p => activeSession.exercises[p]?.done);
    if (allDone) finishSession(activeSession);
  },[activeSession]);

  function finishSession(sess) {
    const totalSets = activePatternIds.reduce((a,p)=>a+(sess.exercises[p]?.completedSets.length||0),0);

    // Per-pattern: did they hit full target on every set?
    const patternResults = {};
    activePatternIds.forEach(p => {
      const target = PATTERNS[p].targets[sess.exercises[p].tierAtStart];
      const sets = sess.exercises[p].completedSets;
      patternResults[p] = sets.length >= target.sets && sets.every(s => s.totalReps >= target.reps);
    });

    const perfectSession = Object.values(patternResults).every(Boolean);

    const xp = 50 + activePatternIds.reduce((a,p)=>{
      const target = PATTERNS[p].targets[sess.exercises[p].tierAtStart];
      const sets = sess.exercises[p].completedSets;
      return a + sets.reduce((b,s) => b + 10 + (s.totalReps >= target.reps ? 5 : 0), 0);
    }, 0) + (perfectSession ? 50 : 0);

    // ── UNLOCK LOGIC
    const newPatterns = JSON.parse(JSON.stringify(profile.patterns));
    const sessionCount = sessions.length + 1; // including this one
    const unlocks = []; // [{patternId, fromTier, toTier, isNewPattern, qualifying}]

    activePatternIds.forEach(p => {
      const ps = newPatterns[p];
      // Update consecutiveFull
      if (patternResults[p]) ps.consecutiveFull = (ps.consecutiveFull||0) + 1;
      else ps.consecutiveFull = 0;

      // Foundation → Advanced: 2 consecutive full-target sessions, plus min 3 foundation sessions overall
      if (ps.tier === 'foundation') {
        const foundationSessionsSoFar = [...sessions, sess].filter(x => (x.phaseAtStart||'foundation') === 'foundation').length;
        if (sessionCount >= 3 && foundationSessionsSoFar >= 3 && ps.consecutiveFull >= 2) {
          ps.tier = 'advanced';
          ps.consecutiveFull = 0;
          ps.advancedSessionsCompleted = 0;
          unlocks.push({ patternId: p, toTier: 'advanced' });
        }
      }
      // Advanced → Pro: 6 qualifying advanced sessions (NOT consecutive)
      // A qualifying session = hit advanced target on every set AND ≥75% of reps were advanced variation
      else if (ps.tier === 'advanced') {
        if (isQualifyingAdvancedSession(sess, p)) {
          ps.advancedSessionsCompleted = (ps.advancedSessionsCompleted||0) + 1;
        }
        if ((ps.advancedSessionsCompleted||0) >= 6 && PATTERNS[p].variations.pro) {
          ps.tier = 'pro';
          ps.consecutiveFull = 0;
          unlocks.push({ patternId: p, toTier: 'pro' });
        }
      }
    });

    // Phase transition: if all foundation now leveled and pull/corefront not yet present → add them
    // AND reset consecutiveFull on all patterns so the kid can't skip-jump straight to Pro.
    const newPhase = getPhase({ ...profile, patterns: newPatterns });
    const oldPhase = getPhase(profile);
    if (newPhase !== oldPhase && newPhase === 'advanced') {
      Object.values(newPatterns).forEach(ps => { ps.consecutiveFull = 0; });
      if (!newPatterns.pull) { newPatterns.pull = { tier: 'advanced', consecutiveFull: 0, advancedSessionsCompleted: 0 }; unlocks.push({ patternId: 'pull', isNewPattern: true, toTier: 'advanced' }); }
      if (!newPatterns.corefront) { newPatterns.corefront = { tier: 'advanced', consecutiveFull: 0, advancedSessionsCompleted: 0 }; unlocks.push({ patternId: 'corefront', isNewPattern: true, toTier: 'advanced' }); }
    }

    const newProfile = { ...profile, patterns: newPatterns };
    setProfile(newProfile); saveProfile(newProfile);

    const finishedSess = { id: Date.now(), date: new Date().toISOString(), xp, totalSets, perfectSession, durationMs: Date.now()-sess.startTime, phaseAtStart: sess.phaseAtStart };
    const newSessions = [finishedSess, ...sessions];
    setSessions(newSessions); saveSessions(newSessions);

    const newAchIds = checkAchs(newSessions, newProfile, earned, { perfectSession });
    if (newAchIds.length) {
      const newEarned = new Set([...earned, ...newAchIds]);
      setEarned(newEarned); saveEarned(newEarned);
      setAchQueue(newAchIds.map(id => ACHS.find(a => a.id === id)));
    }

    setLastSessionData({ xp, totalSets, perfectSession, durationMs: finishedSess.durationMs, unlocks, sessionCount });
    setActiveSession(null); setActivePatId(null);
    setScreen('complete');
    setShowConf(true); setTimeout(()=>setShowConf(false), 4000);
  }

  // ── ACHIEVEMENT QUEUE
  useEffect(()=>{
    if (achQueue.length && !curAch) {
      const [next, ...rest] = achQueue;
      setCurAch(next); setAchQueue(rest);
      setTimeout(()=>setCurAch(null), 3500);
    }
  },[achQueue, curAch]);

  // ─────────────────────────────────────────────────────────────────────
  // RENDER
  // ─────────────────────────────────────────────────────────────────────
  if (!loaded) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'#07090D'}}>
      <style>{S}</style>
      <div style={{fontFamily:'Barlow Condensed,sans-serif',color:'#F2A900',letterSpacing:'3px',fontSize:'14px'}}>LOADING...</div>
    </div>
  );

  const CLUB_LIST = ["Amersham & Chiltern RFC","England Rugby","Scotland Rugby","Wales Rugby","Ireland Rugby","France Rugby","Italy Rugby","All Blacks","Springboks","Wallabies","Pumas","Other"];

  return (
    <div className="app">
      <style>{S}</style>
      {showConf && <Confetti />}
      {curAch && (
        <div className="ach-pop">
          <div className="ach-inner">
            <div className="ach-emoji">{curAch.emoji}</div>
            <div className="ach-txt">
              <small>Achievement Unlocked</small>
              <strong>{curAch.name}</strong>
              <p>{curAch.desc}</p>
            </div>
            <div className="ach-xp">+{curAch.xp} XP</div>
          </div>
        </div>
      )}
      {restState && (
        <div className="rest-ov">
          <div className="rest-card">
            <div className="rest-lbl">Rest Time</div>
            <div className="rest-num">{restState.secs}</div>
            <div className="rest-sub">seconds remaining</div>
            <button className="btn-skip" onClick={()=>{setRestState(null);restCb.current?.();restCb.current=null;}}>Skip Rest →</button>
          </div>
        </div>
      )}

      {/* SETUP */}
      {screen==='setup' && (
        <div className="setup fade">
          <div className="logo-badge">AMERSHAM & CHILTERN RFC · U13 · 2026</div>
          <div className="logo-title">SUMMER<br/>STRONG</div>
          <div className="logo-sub">YOUR SUMMER. YOUR WORK. YOUR SEASON.</div>
          <div className="welcome-block">
            You'll start at <strong>Foundation</strong>. As you smash the targets, individual exercises unlock <strong>Advanced</strong> and then <strong>Pro</strong> variations — and you can mix them inside the same set. Once every foundation exercise is at Advanced, two new exercises (Pull-Ups and Hollow Body) unlock.
          </div>
          <div className="fl">
            <label>Your name</label>
            <input value={sName} onChange={e=>setSName(e.target.value)} placeholder="Enter your name..." />
          </div>
          <div className="fl">
            <label>Your clubs (pick your teams)</label>
            <div className="clubs-row">
              {CLUB_LIST.map(c=>(
                <div key={c} className={`club-btn ${sClubs.includes(c)?'sel':''}`}
                  onClick={()=>setSClubs(prev=>prev.includes(c)?prev.filter(x=>x!==c):[...prev.slice(-2),c])}>
                  {c}
                </div>
              ))}
            </div>
          </div>
          <button className="btn btn-gold" onClick={handleSetup} disabled={!sName.trim()}>Let's Get To Work →</button>
        </div>
      )}

      {/* HOME */}
      {screen==='home' && profile && (
        <div className="fade" style={{paddingBottom:90}}>
          <div className="home-hdr">
            <div className="home-greet">
              <small>SUMMER STRONG · {TIER_LABEL[phase]?.toUpperCase()} PHASE</small>
              <h2>Let's go, <span>{profile.name}</span>.</h2>
            </div>
            <div className="xp-block">
              <div className="xp-top"><span>LEVEL {xpLevel} · {totalXP} XP</span><strong>{Math.round(xpProgress*100)}% to next</strong></div>
              <div className="xp-bar"><div className="xp-fill" style={{width:`${xpProgress*100}%`}} /></div>
            </div>
          </div>

          <div className="stats-row">
            <div className="sc"><div className="sc-val">{sessions.length}</div><div className="sc-lbl">Sessions</div></div>
            <div className="sc"><div className="sc-val" style={{color:streak>0?'#F2A900':'var(--text3)'}}>{streak}</div><div className="sc-lbl">Day Streak</div></div>
            <div className="sc"><div className="sc-val">{sessions.filter(s=>s.perfectSession).length}</div><div className="sc-lbl">Perfect</div></div>
          </div>

          <div className="sec" style={{marginBottom:8}}>
            <div className="phase-card">
              <div className="phase-top">
                <div className="phase-name">Progression</div>
                <div className="phase-chip">{TIER_LABEL[phase]} Phase</div>
              </div>
              <div className="phase-progress-row">
                {ALL_PATTERN_ORDER.filter(p => profile.patterns[p]).map(p => {
                  const t = profile.patterns[p].tier;
                  return <div key={p} className={`phase-pill ${TIER_SHORT[t].toLowerCase()}`} title={`${PATTERNS[p].label}: ${TIER_LABEL[t]}`} />;
                })}
              </div>
              <div className="phase-note">
                {sessions.length < 3
                  ? `${3 - sessions.length} more foundation session${sessions.length===2?'':'s'} until variations can unlock`
                  : phase === 'foundation'
                    ? 'Hit full target on every set, two sessions in a row, to unlock the next variation per exercise'
                    : phase === 'advanced'
                      ? 'Pro unlocks per-exercise after 6 advanced sessions where ≥75% of reps were the advanced variation'
                      : 'Pro phase — full strength mode 💪'}
              </div>
            </div>
          </div>

          <div className="sec" style={{marginBottom:16}}>
            <div className="session-cta" onClick={startSession}>
              <h3>Today's Session 🏉</h3>
              <p>{activePatternIds.length} exercises · {phase==='foundation'?'3':phase==='advanced'?'3':'4'}× per week · Full body</p>
              <div className="cta-inner">START SESSION</div>
            </div>
          </div>

          <div className="sec" style={{marginBottom:16}}>
            <div className="sec-lbl">Recent Sessions</div>
            {sessions.length===0
              ? <div className="hist-empty">No sessions yet — hit Start Session! 👆</div>
              : sessions.slice(0,5).map(s=>(
                <div className="hist-item" key={s.id}>
                  <div className="hi-l">
                    <small>{fmtDate(s.date)} · {fmtDur(s.durationMs)} · {TIER_LABEL[s.phaseAtStart||'foundation']}</small>
                    <strong>{s.totalSets} sets {s.perfectSession?'· ⭐ Perfect':''}</strong>
                  </div>
                  <div className="hi-xp">+{s.xp} XP</div>
                </div>
              ))
            }
          </div>

          <div className="sec">
            <div style={{textAlign:'center',marginTop:16}}>
              <button className="btn btn-ghost btn-sm" onClick={handleReset} style={{width:'auto',padding:'8px 18px'}}>Reset All Data</button>
            </div>
          </div>
        </div>
      )}

      {/* SESSION (exercise list) */}
      {screen==='session' && !activePatId && activeSession && (
        <div className="fade" style={{paddingBottom:90}}>
          <div className="sess-hdr">
            <button className="back" onClick={()=>setScreen('home')}>← Home</button>
            <h2>{TIER_LABEL[phase]} Session</h2>
            <p>{activePatternIds.filter(p=>activeSession.exercises[p]?.done).length} of {activePatternIds.length} done</p>
            <div className="prog-bar">
              <div className="prog-fill" style={{width:`${(activePatternIds.filter(p=>activeSession.exercises[p]?.done).length/activePatternIds.length)*100}%`}} />
            </div>
          </div>
          <div className="ex-list">
            {activePatternIds.map(patId => {
              const pat = PATTERNS[patId];
              const exSt = activeSession.exercises[patId];
              const done = exSt?.done;
              const setsComplete = exSt?.completedSets?.length || 0;
              const tier = profile.patterns[patId].tier;
              const variation = pat.variations[tier];
              const target = pat.targets[tier];
              const mixable = getMixableVariations(profile, patId);
              return (
                <div key={patId} className={`ex-card ${done?'done':''}`} onClick={()=>!done && openExercise(patId)}>
                  <div className="ex-chk">{done?'✓':variation.emoji}</div>
                  <div className="ex-info">
                    <div className="ex-cat">{pat.label} <span className={`ex-tier ${TIER_SHORT[tier].toLowerCase()}`}>{TIER_LABEL[tier]}</span>
                      {mixable.length > 1 && <span style={{fontSize:10,color:'var(--text3)',marginLeft:4}}>· mix unlocked</span>}
                    </div>
                    <div className="ex-name">{variation.name}</div>
                    <div className="ex-meta">
                      {setsComplete>0?`${setsComplete}/${target.sets} sets done`:`${target.sets} sets · ${target.range}`}
                      {tier === 'advanced' && PATTERNS[patId].variations.pro && (
                        <span style={{marginLeft:8,color:'var(--gold)',fontFamily:'var(--fc)',fontWeight:700,letterSpacing:.5}}>
                          · {profile.patterns[patId].advancedSessionsCompleted||0}/6 → Pro
                        </span>
                      )}
                    </div>
                  </div>
                  {!done && <div className="ex-arr">›</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* EXERCISE DETAIL */}
      {screen==='session' && activePatId && activePat && activeTarget && (
        <div className="exd fade">
          <div className="exd-hdr">
            <button className="back" onClick={()=>setActivePatId(null)}>← Back to session</button>
            <div className="exd-cat">{activePat.label} · {TIER_LABEL[activePatTier]}</div>
            <div className="exd-title">{activeVariation.name}</div>
            {(activeVariation.note||activeTarget.note) && <div className="exd-note">⚡ {activeVariation.note||activeTarget.note}</div>}
          </div>

          <div className="sets-pips">
            {Array.from({length:activeTarget.sets},(_,i)=>{
              const done = (activeSession?.exercises[activePatId]?.completedSets?.length||0);
              return <div key={i} className={`pip ${i<done?'done':i===done?'cur':''}`} />;
            })}
          </div>

          <div className="setlog">
            <div className="setlog-hdr">Set {curSet} of {activeTarget.sets}</div>

            {activeTarget.type === 'reps' && (
              <>
                <div className="target-box">
                  <div className="target-num">{activeTarget.reps}</div>
                  <div className="target-lbl">reps target</div>
                </div>

                {/* Variation tabs — only mixable (same target type) */}
                {mixableVars.length > 1 && (
                  <>
                    <div style={{fontSize:11,color:'var(--text2)',letterSpacing:1,fontFamily:'var(--fc)',fontWeight:700,marginBottom:6,textTransform:'uppercase'}}>Mix variations:</div>
                    <div className="var-tabs">
                      {mixableVars.map(v => {
                        const vData = activePat.variations[v];
                        const count = repsByVar[v] || 0;
                        return (
                          <button key={v} className={`var-tab ${activeVar===v?'active':''}`}
                            onClick={()=>{ commitPending(); setActiveVar(v); }}>
                            <div className="vt-name">{vData.name.replace('Push-Up','Push').replace('Bodyweight Squat','BW Sq').replace('Glute Bridge','Glute B')}</div>
                            <div className="vt-count">{count}</div>
                          </button>
                        );
                      })}
                    </div>
                  </>
                )}

                {currentSetTotal > 0 && (
                  <div className="cumul-bar">
                    <span>{currentSetTotal} done · {Math.max(0,activeTarget.reps-currentSetTotal)} to target</span>
                    <strong>{currentSetTotal}/{activeTarget.reps}</strong>
                  </div>
                )}

                <div className="rep-row">
                  <button className="rep-adj" onClick={()=>setPendingReps(r=>Math.max(0,r-1))}>−</button>
                  <input
                    type="number"
                    inputMode="numeric"
                    className={`rep-input ${pendingReps===0?'empty':currentSetTotal>=activeTarget.reps?'good':''}`}
                    value={pendingReps}
                    onChange={e=>{ const v=parseInt(e.target.value); setPendingReps(isNaN(v)?0:Math.max(0,v)); }}
                    onFocus={e=>e.target.select()}
                  />
                  <button className="rep-adj" onClick={()=>setPendingReps(r=>r+1)}>+</button>
                </div>
                <div className={`rep-hint ${currentSetTotal>=activeTarget.reps?'good':currentSetTotal>0?'warn':''}`}>
                  {currentSetTotal===0 ? `Tap +, − or just type${mixableVars.length>1?` reps for ${activeVariation.name}`:''}` :
                   currentSetTotal>=activeTarget.reps ? `✓ Target hit! (${currentSetTotal} reps total)` :
                   `${activeTarget.reps-currentSetTotal} more to target — keep going!`}
                </div>
                <button className="btn btn-green" disabled={currentSetTotal===0} onClick={tryLogSet}>
                  {currentSetTotal>=activeTarget.reps ? '✓ Complete Set' : 'Log Reps & Continue'}
                </button>
                {currentSetTotal>0 && currentSetTotal<activeTarget.reps && (
                  <button className="btn btn-ghost btn-sm btn-gap" onClick={forceComplete}>Count as complete anyway</button>
                )}
              </>
            )}

            {activeTarget.type === 'time' && (
              <div className="timer-wrap">
                {!timerPhase && (
                  <>
                    <div className="target-box">
                      <div className="target-num">{activeTarget.reps}s</div>
                      <div className="target-lbl">{activeTarget.reps && (activeTarget.note||activeVariation.note) ? 'each side' : 'hold'}</div>
                    </div>
                    <button className="btn btn-gold" style={{marginTop:12}} onClick={()=>{setTimerTotal(activeTarget.reps);setTimerSecs(activeTarget.reps);setTimerPhase((activeTarget.note||activeVariation.note)?'left':'right');}}>
                      {(activeTarget.note||activeVariation.note) ? 'Start — Left Side' : 'Start Hold'}
                    </button>
                  </>
                )}
                {(timerPhase==='left'||timerPhase==='right') && (
                  <>
                    {(activeTarget.note||activeVariation.note) && <div className="timer-side-lbl">{timerPhase==='left'?'Left Side':'Right Side'}</div>}
                    <TimerRing secs={timerSecs} total={timerTotal} />
                    <button className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={()=>setTimerSecs(0)}>Done early</button>
                  </>
                )}
                {timerPhase==='switch' && (
                  <div style={{textAlign:'center',padding:'40px 0'}}>
                    <div style={{fontSize:56,marginBottom:12}}>🔄</div>
                    <div style={{fontFamily:'var(--fc)',fontSize:24,fontWeight:800,color:'var(--gold)',letterSpacing:2}}>SWITCH SIDES!</div>
                  </div>
                )}
                {timerPhase==='right_ready' && (
                  <>
                    <div className="target-box">
                      <div className="target-num">{activeTarget.reps}s</div>
                      <div className="target-lbl">right side</div>
                    </div>
                    <button className="btn btn-gold" style={{marginTop:12}} onClick={()=>{setTimerSecs(activeTarget.reps);setTimerPhase('right');}}>Start — Right Side</button>
                  </>
                )}
                {timerPhase==='done' && (
                  <div style={{textAlign:'center',padding:'20px 0'}}>
                    <div style={{fontSize:48,marginBottom:8}}>✅</div>
                    <div style={{fontFamily:'var(--fh)',fontSize:28,fontWeight:700,marginBottom:16}}>Set complete!</div>
                    <button className="btn btn-green" onClick={handleTimerDone}>Continue</button>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Technique guides for ALL unlocked variations */}
          <div className="tech-sec">
            <button className={`tech-tog ${showTech?'open':''}`} onClick={()=>setShowTech(v=>!v)}>
              <span>📋 Technique Guide{unlockedVars.length>1?'s':''}</span>
              <span style={{color:'var(--gold)',fontSize:18}}>{showTech?'▲':'▼'}</span>
            </button>
            {showTech && (
              <div className="tech-body">
                {unlockedVars.map(v => {
                  const vData = activePat.variations[v];
                  return (
                    <div key={v}>
                      <div className="tech-block-title">{TIER_LABEL[v]} · {vData.name}</div>
                      {vData.steps.map((s,i)=>(
                        <div className="tech-step" key={i}><span className="tech-step-n">{i+1}.</span><span>{s}</span></div>
                      ))}
                      <div style={{marginTop:8}}>
                        {vData.cues.map((c,i)=><div className="tech-cue" key={i}>{c}</div>)}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      )}

      {/* COMPLETE */}
      {screen==='complete' && lastSessionData && (
        <div className="comp fade">
          <div className="comp-emoji">🏆</div>
          <div className="comp-title">SESSION<br/>DONE.</div>
          <div className="comp-msg">
            {profile?.clubs?.length
              ? randFrom(CLUB_MSGS[profile.clubs.find(c=>CLUB_MSGS[c])] || CLUB_MSGS["Amersham & Chiltern RFC"])
              : "That's Chiltern rugby strength. 🏉"}
          </div>
          {lastSessionData.unlocks?.length > 0 && (
            <>
              {lastSessionData.unlocks.map((u,i) => (
                <div key={i} className="unlock-banner">
                  <div className="unlock-icon">{u.isNewPattern ? '🆕' : '🔓'}</div>
                  <div className="unlock-txt">
                    <small>{u.isNewPattern ? 'NEW EXERCISE' : 'VARIATION UNLOCKED'}</small>
                    <strong>{PATTERNS[u.patternId].label}: {PATTERNS[u.patternId].variations[u.toTier].name}</strong>
                  </div>
                </div>
              ))}
            </>
          )}
          <div className="xp-card">
            <div className="xp-card-num">+{lastSessionData.xp}</div>
            <div className="xp-card-lbl">XP EARNED</div>
          </div>
          <div className="comp-stats">
            <div className="comp-sc"><div className="comp-sc-val">{lastSessionData.totalSets}</div><div className="comp-sc-lbl">Sets done</div></div>
            <div className="comp-sc"><div className="comp-sc-val">{fmtDur(lastSessionData.durationMs)}</div><div className="comp-sc-lbl">Duration</div></div>
            <div className="comp-sc"><div className="comp-sc-val">{lastSessionData.perfectSession?'⭐':'💪'}</div><div className="comp-sc-lbl">{lastSessionData.perfectSession?'Perfect!':'Good work'}</div></div>
          </div>
          <button className="btn btn-gold" onClick={()=>setScreen('home')}>Back to Home</button>
        </div>
      )}

      {/* CALENDAR / SCORE SHEET */}
      {screen==='calendar' && (
        <div className="fade" style={{paddingBottom:90}}>
          <div className="cal-hdr">
            <h2>Score Sheet</h2>
            <p>16 weeks · May → Sept 2026 · Tick every session you do</p>
          </div>
          <div className="cal-legend">
            <span>✓ session</span>
            <span>🏉 rugby thursday</span>
            <span style={{color:'var(--gold)'}}>● today</span>
          </div>
          <div className="cal-grid">
            <div className="cal-row head">
              <div className="cal-day-h"></div>
              <div className="cal-day-h">M</div>
              <div className="cal-day-h">T</div>
              <div className="cal-day-h">W</div>
              <div className="cal-day-h">T</div>
              <div className="cal-day-h">F</div>
              <div className="cal-day-h">S</div>
              <div className="cal-day-h">S</div>
              <div className="cal-day-h">TLY</div>
            </div>
            {getCalendar().map(week => {
              const weekTarget = phase==='pro'?5:4; // 4 ticks/wk for foundation/advanced, 5 for pro
              const weekTally = week.days.filter(d => !d.empty && (sessions.some(s => sameDay(new Date(s.date), d.date)) || d.isThursday)).length;
              return (
                <div key={week.num} className="cal-row">
                  <div className="cal-wknum">{week.num}</div>
                  {week.days.map((d,i) => {
                    if (d.empty) return <div key={i} className="cal-cell empty" />;
                    const sessionDone = sessions.some(s => sameDay(new Date(s.date), d.date));
                    const today = sameDay(d.date, new Date());
                    const cls = ['cal-cell'];
                    if (d.isBankHoliday) cls.push('bh');
                    if (d.isThursday) cls.push('thu');
                    if (today) cls.push('today');
                    if (sessionDone) cls.push('done');
                    return (
                      <div key={i} className={cls.join(' ')}>
                        <div className="cal-date">{d.date.getDate()}{d.date.getDate()===1?(' '+d.date.toLocaleString('en-GB',{month:'short'})):''}</div>
                        <div className={`cal-tick ${d.isThursday&&!sessionDone?'rugby':''}`}>
                          {sessionDone ? '✓' : d.isThursday ? '🏉' : ''}
                        </div>
                      </div>
                    );
                  })}
                  <div className={`cal-tally ${weekTally>=weekTarget?'hit':''}`}>{weekTally}/{weekTarget}</div>
                </div>
              );
            })}
          </div>
          <div className="cal-summary">
            <div className="cal-summary-row"><span>Total sessions logged</span><strong>{sessions.length}</strong></div>
            <div className="cal-summary-row"><span>Perfect sessions</span><strong>{sessions.filter(s=>s.perfectSession).length}</strong></div>
            <div className="cal-summary-row"><span>Day streak</span><strong>{streak}</strong></div>
          </div>
        </div>
      )}

      {/* ACHIEVEMENTS */}
      {screen==='achievements' && (
        <div className="fade" style={{paddingBottom:90}}>
          <div className="achs-hdr">
            <h2>Badges</h2>
            <p style={{fontSize:13,color:'var(--text2)',marginTop:4}}>{earned.size} of {ACHS.length} unlocked · {totalXP} total XP</p>
          </div>
          <div className="achs-grid">
            {ACHS.map(a=>(
              <div key={a.id} className={`ach-row ${earned.has(a.id)?'earned':'locked'}`}>
                <div className="ach-row-em">{earned.has(a.id)?a.emoji:'🔒'}</div>
                <div className="ach-row-inf">
                  <small>{earned.has(a.id)?'Unlocked':'Locked'}</small>
                  <strong>{a.name}</strong>
                  <div style={{fontSize:12,color:'var(--text2)'}}>{a.desc}</div>
                </div>
                <div className="ach-row-xp">+{a.xp} XP</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* BOTTOM NAV */}
      {['home','calendar','achievements'].includes(screen) && (
        <nav className="bnav">
          {[
            {k:'home',icon:'🏠',lbl:'Home'},
            {k:'calendar',icon:'📅',lbl:'Calendar'},
            {k:'achievements',icon:'🏆',lbl:'Badges'},
          ].map(n=>(
            <div key={n.k} className={`bni ${screen===n.k?'on':''}`} onClick={()=>setScreen(n.k)}>
              <div className="bni-icon">{n.icon}</div>
              <div className="bni-lbl">{n.lbl}</div>
            </div>
          ))}
        </nav>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('ss-root'));
root.render(React.createElement(SummerStrong));
document.getElementById('ss-loading').style.display = 'none';
</script>
</body>
</html>
